name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type 'DEPLOY' to confirm production deployment"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm_production_deploy }}" != "DEPLOY" ]; then
            echo "::error::Deployment cancelled - confirmation text did not match"
            exit 1
          fi

  check-staging-health:
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - name: Check staging deployment status
        run: |
          echo "Checking staging health..."
          curl -f https://staging.downtown65.site/ || exit 1
          curl -f https://staging-api.downtown65.site/health || exit 1
          echo "✅ Staging is healthy"
  merge:
    runs-on: ubuntu-22.04
    needs: check-staging-health
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for proper merging
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest branches
        run: |
          git fetch origin staging
          git fetch origin main

      - name: Checkout main branch
        run: git checkout main

      - name: Merge staging into main
        id: merge
        run: |
          echo "Using rebase merge strategy"
          git rebase origin/staging

      - name: Push to main
        run: git push origin main

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Successfully merged staging to main"
          echo "::notice::Staging has been merged to main branch"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Failed to merge staging to main"
          echo "::error::Merge failed - please resolve conflicts manually"
  
  deploy-production:
    needs: merge
    uses: ./.github/workflows/push-staging-or-production.yaml
    with:
      # Pass the branch name so the reusable workflow knows which environment
      ref: main
    secrets: inherit