name: Deploy Preview Frontend

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: number
    outputs:
      frontend-url:
        value: ${{ jobs.deploy.outputs.frontend-url }}

env:
  URL: "https://pr-${{ inputs.pr-number }}.downtown65.site"

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: development
    outputs:
      frontend-url: ${{ env.URL }}

    steps:
      - uses: actions/checkout@v6
      - name: Setup Project
        uses: ./.github/actions/setup-project
      - name: Generate wrangler config for PR
        working-directory: apps/frontend
        run: |
          cat wrangler.jsonc | \
            sed "s/\$PR_NUMBER/${PR_NUMBER}/g" | \
            > wrangler.pr-${PR_NUMBER}.jsonc

          echo "Show pr json"
          cat wrangler.pr-${PR_NUMBER}.jsonc

      - name: Deploy Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/frontend
          environment: pull-request
          preCommands: |
            CLOUDFLARE_ENV=pull-request pnpm run build
          command: deploy -c wrangler.pr-${{ inputs.pr-number }}.jsonc
          secrets: |
            API_KEY
            COOKIE_SESSION_SECRET
        env:
          API_KEY: ${{ secrets.DT65_API_KEY }}
          COOKIE_SESSION_SECRET: ${{ secrets.FRONTEND_COOKIE_SESSION_SECRET }}

      - name: Display Frontend URL
        run: |
          echo "### 🚀 Frontend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend URL: ${{ env.URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Open Frontend](${{ env.URL }})" >> $GITHUB_STEP_SUMMARY