name: Deploy Events To Production Or Staging

# Controls when the workflow will run
on:
    workflow_call:
        inputs:
            wrangler-environment:
                required: true
                type: string
        outputs:
            events-url:
                description: "The URL of the deployed events"
                value: ${{ jobs.deploy.outputs.url }}

jobs:
    deploy:
        outputs:
            url: ${{ steps.set-url.outputs.url }}
        runs-on: ubuntu-22.04
        environment: production
        steps:
            - uses: actions/checkout@v6

            - name: Setup Project
              uses: ./.github/actions/setup-project

            - name: Deploy Events
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: apps/events
                  environment: ${{ inputs.wrangler-environment }}
                  preCommands: |
                      CLOUDFLARE_ENV=${{ inputs.wrangler-environment }} pnpm run build
                  secrets: |
                      API_KEY
                      COOKIE_SESSION_SECRET
              env:
                  API_KEY: ${{ secrets.DT65_API_KEY }}
                  COOKIE_SESSION_SECRET: ${{ secrets.FRONTEND_COOKIE_SESSION_SECRET }}

            - name: Set Events URL
              id: set-url
              run: |
                  if [ "${{ inputs.wrangler-environment }}" = "staging" ]; then
                      echo "url=https://events.staging.downtown65.com" >> $GITHUB_OUTPUT
                  else
                      echo "url=https://events.downtown65.com" >> $GITHUB_OUTPUT
                  fi

            - name: Display Events URL
              run: |
                  echo "### 🚀 Events Deployed" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Events URL: ${{ steps.set-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "🔗 [Open Events](${{ steps.set-url.outputs.url }})" >> $GITHUB_STEP_SUMMARY