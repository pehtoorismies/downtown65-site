name: Push to Staging or Production

on:
  push:
    branches: ['staging']
  workflow_call:
    inputs:
      ref:
        description: "Branch ref main"
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  determine-environment:
    runs-on: ubuntu-22.04
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      database-name: ${{ steps.set-env.outputs.database-name }}
    steps:
      - name: Set environment variables
        id: set-env
        run: |
          BRANCH="${{ inputs.ref || github.ref_name }}"
          
          if [ "$BRANCH" = "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "database-name=production-dt65-events" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "database-name=staging-dt65-events" >> $GITHUB_OUTPUT
          fi
          
          echo "Deploying to: $BRANCH → $([ "$BRANCH" = "main" ] && echo "production" || echo "staging")"

  deploy-api:
    needs: determine-environment
    uses: ./.github/workflows/deploy-api.yaml
    with:
      wrangler-environment: ${{ needs.determine-environment.outputs.environment }}
      database-name: ${{ needs.determine-environment.outputs.database-name }}
    secrets: inherit

  deploy-events:
    needs: [determine-environment, deploy-api]
    uses: ./.github/workflows/deploy-events.yaml
    with:
      wrangler-environment: ${{ needs.determine-environment.outputs.environment }}
    secrets: inherit
