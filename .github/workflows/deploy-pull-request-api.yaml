name: Deploy PR API

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: number
    outputs:
      api-url:
        value: ${{ jobs.deploy.outputs.api-url }}

env:
  DATABASE_NAME: "pr-${{ inputs.pr-number }}-dt65-events"
  URL: "https://api-pr-${{ inputs.pr-number }}.downtown65.com"

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: development
    outputs:
      api-url: ${{ env.URL }}

    steps:
      - uses: actions/checkout@v6
      - name: Setup Project
        uses: ./.github/actions/setup-project
      - name: Setup Database
        id: db-setup
        uses: ./.github/actions/setup-d1-database
        with:
          database-name: ${{ env.DATABASE_NAME }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate wrangler config for PR
        working-directory: apps/api
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          PR_DATABASE_ID: ${{ steps.db-setup.outputs.database-id }}
        run: |
          envsubst '$PR_NUMBER $PR_DATABASE_ID' < wrangler.jsonc > wrangler.jsonc.tmp
          mv wrangler.jsonc.tmp wrangler.jsonc

          echo "Wrangler config after replacements:"
          cat wrangler.jsonc

      - name: Run Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: apps/api
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          environment: pull-request
          preCommands: ./scripts/drizzle_flatten.sh
          command: d1 migrations apply ${{ env.DATABASE_NAME }} --remote

      - name: Deploy API
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: apps/api
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          environment: pull-request
          secrets: |
            API_KEY
            REGISTER_SECRET
            AUTH_CLIENT_SECRET
        env:
          API_KEY: ${{ secrets.DT65_API_KEY }}
          REGISTER_SECRET: ${{ secrets.BACKEND_REGISTER_SECRET }}
          AUTH_CLIENT_SECRET: ${{ secrets.BACKEND_AUTH_CLIENT_SECRET }}

      - name: Wait for API Health Check
        run: |
          echo "Waiting for API to be ready..."
          max_attempts=10
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            if curl -sf "${{ env.URL }}/healthz" > /dev/null; then
              echo "✅ API is ready!"
              exit 0
            fi
            
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts - API not ready yet, waiting 2 seconds..."
            sleep 2
          done

          echo "❌ API failed to become ready after $max_attempts attempts"
          exit 1

      - name: Sync Users
        run: |
          curl -X POST "${{ env.URL }}/sync/users" \
            --header 'x-api-key: ${{ secrets.DT65_API_KEY }}'

      - name: Display API URL
        run: |
          echo "### 🚀 API Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "API URL: ${{ env.URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Open API](${{ env.URL }})" >> $GITHUB_STEP_SUMMARY