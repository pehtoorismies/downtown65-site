name: Promote Staging to Production

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type 'DEPLOY' to confirm production deployment"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm_production_deploy }}" != "DEPLOY" ]; then
            echo "::error::Deployment cancelled - confirmation text did not match"
            exit 1
          fi

  check-staging-health:
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - name: Check staging deployment status
        run: |
          echo "Checking staging health..."
          curl -f https://events-staging.downtown65.com/ || exit 1
          curl -f https://api-staging.downtown65.com/healthz || exit 1
          echo "✅ Staging is healthy"

  merge:
    runs-on: ubuntu-22.04
    needs: check-staging-health
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest branches
        run: |
          git fetch origin staging
          git fetch origin main

      - name: Merge staging → main
        run: |
          git checkout main
          git merge origin/staging --no-ff -m 'chore: promote staging to production'
          git push origin main
